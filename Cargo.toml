[package]
name = "mdbook-external-links2"
description = "Open external links inside your mdBooks in a different tab"
keywords = [
  "mdbook",
  "external",
  "links",
  "mdbook-plugin",
  "mdbook-preprocessor",
]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/avivace/mdbook-external-links"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
clap = "4.5.53"
mdbook-preprocessor = "0.5.2"
pulldown-cmark = "0.13.0"
pulldown-cmark-to-cmark = "22.0.0"
semver = "1.0.27"
serde_json = "1.0.148"